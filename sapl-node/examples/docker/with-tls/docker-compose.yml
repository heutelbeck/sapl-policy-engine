# Demonstrates TLS on both transports (HTTP + RSocket) with one certificate
# from PEM files. Run ./generate-certificate.sh first to create the
# self-signed development certificate at ./tls/server.pem and its key at
# ./tls/server.key.

services:
  sapl-node:
    image: ghcr.io/heutelbeck/sapl-node:5.0.0-SNAPSHOT
    container_name: sapl-node-tls
    ports:
      - "8443:8443"
      - "7000:7000"
    volumes:
      - ./policies:/pdp/data:ro
      - ./tls:/pdp/tls:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Authentication: no-auth so the demo focuses on the TLS plumbing
      - IO_SAPL_NODE_ALLOWNOAUTH=true
      - IO_SAPL_NODE_ALLOWBASICAUTH=false
      - IO_SAPL_NODE_ALLOWAPIKEYAUTH=false
      - IO_SAPL_NODE_ALLOWOAUTH2AUTH=false

      # Policy source
      - IO_SAPL_PDP_EMBEDDED_PDPCONFIGTYPE=DIRECTORY
      - IO_SAPL_PDP_EMBEDDED_POLICIESPATH=/pdp/data

      # One certificate for both APIs. A renewed certificate is served
      # without a restart.
      - IO_SAPL_NODE_TLS_CERTIFICATECHAIN=/pdp/tls/server.pem
      - IO_SAPL_NODE_TLS_PRIVATEKEY=/pdp/tls/server.key

      # HTTPS on 8443, RSocket TLS on 7000
      - SERVER_PORT=8443
      - SAPL_PDP_RSOCKET_ENABLED=true
      - SAPL_PDP_RSOCKET_PORT=7000

      # Bind to 0.0.0.0 so the docker port mapping works
      - SERVER_ADDRESS=0.0.0.0
      # Paketo default MaxDirectMemorySize=10M is too low for Netty
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=256M

      - IO_SAPL_PDP_EMBEDDED_PRINTTEXTREPORT=true
    restart: unless-stopped
