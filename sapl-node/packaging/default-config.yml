#
# SAPL Node Package Configuration
#
# This file is installed to /etc/sapl/application.yml and is
# preserved across package upgrades (config|noreplace).
#
# The systemd service uses --spring.config.additional-location=file:/etc/sapl/application.yml
# so this file overlays the JAR-embedded defaults.
#
# The node will not start until TLS, an authentication mode and bundle
# security are configured. It sets no opt-in for plaintext or anonymous
# access. See /var/lib/sapl/README for the quick start workflow.
#
# Security progression:
#   Level 0: Configure public key (or allow-unsigned to opt out)
#   Level 1: Configure TLS (or allow-no-tls behind a TLS-terminating proxy)
#   Level 2: Enable auth, generate credentials
#   Level 3: TLS + auth + signed bundles + metrics (production)
#

spring:
  application.name: sapl
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h,recordStats
    cache-names:
      - ApiKeyCache
      - buckets

# --- Server ---

server:
  address: 127.0.0.1
  port: 8080
  # Both APIs serve the certificate of io.sapl.node.tls below. To serve
  # another certificate on HTTP only, name an SSL bundle of spring.ssl.bundle
  # in server.ssl.bundle.

# --- Client Authentication ---
#
# The node supports four authentication modes. Multiple can be enabled
# simultaneously. The node refuses to start until one is enabled, or until
# anonymous access is allowed explicitly with allow-no-auth: true, for example
# where an authenticating proxy owns the trust boundary.

io.sapl:
  node:
    # --- TLS ---
    #
    # One certificate for both APIs, as PEM files readable by the sapl user:
    #   sudo chown root:sapl /etc/sapl/tls/server.pem /etc/sapl/tls/server.key
    #   sudo chmod 640 /etc/sapl/tls/server.key
    # A renewed certificate is served without a restart. A certificate is
    # reported in the log from 14 days before it expires.
    #
    # tls:
    #   certificate-chain: /etc/sapl/tls/server.pem
    #   private-key: /etc/sapl/tls/server.key
    #
    # Plaintext only where TLS is terminated upstream, by a proxy or a
    # service mesh. The node logs a warning at every start.
    # allow-no-tls: true

    # allow-no-auth: true
    allow-basic-auth: false
    allow-api-key-auth: false
    allow-oauth2-auth: false

    # PDP ID routing (multi-tenant)
    # reject-on-missing-pdp-id: false
    # default-pdp-id: "default"

    # OAuth2 settings (only relevant if allow-oauth2-auth is true)
    # oauth:
    #   pdp-id-claim: "sapl_pdp_id"

    # User entries for Basic Auth and API Key authentication.
    # Each user is associated with a pdp-id for multi-tenant routing.
    #
    # Generate credentials:
    #   sapl generate basic --id "my-client" --pdp-id "production"
    #   sapl generate apikey --id "my-client" --pdp-id "staging"
    #
    # users:
    #   - id: "my-basic-client"
    #     pdp-id: "default"
    #     basic:
    #       username: "my-username"
    #       secret: "$argon2id$..."
    #
    #   - id: "my-apikey-client"
    #     pdp-id: "default"
    #     api-key-id: "<10-char-id-from-generator>"
    #     api-key: "$argon2id$..."

  # --- PDP Policy Source ---
  #
  # This package defaults to BUNDLES mode. The PDP loads .saplbundle
  # files from /var/lib/sapl/. Bundles provide atomic policy
  # updates with optional Ed25519 signature verification.
  #
  # pdp-config-type options:
  #   BUNDLES          - Monitor directory for .saplbundle files (package default)
  #   DIRECTORY        - Monitor a directory for pdp.json and *.sapl files
  #   MULTI_DIRECTORY  - Subdirectories as tenants (subdir name = pdp-id)
  #   RESOURCES        - Load from classpath (fixed, no runtime updates)
  #   REMOTE_BUNDLES   - Fetch .saplbundle files from HTTP server

  pdp.embedded:
    enabled: true
    pdp-config-type: BUNDLES
    config-path: /var/lib/sapl
    policies-path: /var/lib/sapl
    metrics-enabled: true

    # --- Decision Reporting ---
    # print-trace: false
    # print-json-report: false
    # print-text-report: false
    # pretty-print-reports: false
    # print-subscription-events: false
    # print-unsubscription-events: false

    # --- Bundle Security ---
    #
    # The node will not start until one of these options is configured.
    # Generate a keypair: sapl bundle keygen -o /etc/sapl/signing
    #
    # bundle-security:
      # Option 1: Global public key (recommended)
      # All bundles must be signed with the corresponding private key.
      # public-key-path: /etc/sapl/signing.pub

      # Option 2: Per-tenant key catalogue
      # keys:
      #   prod-key-2025: "MCowBQYDK2VwAyEA..."
      #   staging-key: "MCowBQYDK2VwAyEA..."
      # tenants:
      #   production:
      #     - "prod-key-2025"
      #   staging:
      #     - "staging-key"

      # Option 3: Allow unsigned bundles (development/evaluation only)
      # The node logs a warning on every startup when this is enabled.
      # allow-unsigned: true
      # unsigned-tenants:
      #   - "development"

    # --- Sealed Bundle Secrets ---
    #
    # Keep current and previous X25519 private keys together during rotation.
    # Remove the previous key only after every bundle has been resealed.
    #
    # secrets:
    #   private-key-paths:
    #     - /etc/sapl/bundle-recipient-current.jwk
    #     - /etc/sapl/bundle-recipient-previous.jwk
    #   accept-unencrypted: false

    # --- Remote Bundles ---
    #
    # Required when pdp-config-type is REMOTE_BUNDLES.
    #
    # remote-bundles:
    #   base-url: https://pap.example.com/bundles
    #   pdp-ids:
    #     - default
    #   mode: POLLING
    #   poll-interval: 5s
    #   # long-poll-timeout: 30s
    #   # auth-header-name: Authorization
    #   # auth-header-value: "Bearer <token>"
    #   # allow-insecure-http: false
    #   # follow-redirects: true

# --- OAuth2 Resource Server ---
#
# Required when allow-oauth2-auth is true.
#
# spring.security.oauth2:
#   resourceserver:
#     jwt.issuer-uri: https://your-auth-server/realms/your-realm

# --- Side-Loading Extensions ---
#
# Add function libraries and PIPs from external JARs.
# Beans in sub-packages of io.sapl.server or with matching
# Spring auto-configuration will be loaded at startup.
#
# loader.path: /path/to/lib

# --- Keep-Alive ---
#
# Interval in seconds between keep-alive frames on idle SSE streaming
# connections. Prevents proxies and firewalls from dropping inactive
# connections and lets the server detect clients that drop without closing.
# Always on; default 15 seconds. Values below 1 are raised to 1; it cannot
# be disabled. Keep it below the smallest proxy idle timeout on the path.
#
# io.sapl.node.keep-alive: 15

# --- Multi-Subscription Limit ---
#
# Maximum number of entries accepted in a MultiAuthorizationSubscription on
# public HTTP and RSocket PDP endpoints.
#
# io.sapl.node.max-multi-subscription-count: 256

# --- Rate Limiting ---

bucket4j:
  enabled: false
  filters:
    - id: filter1
      cache-name: buckets
      filter-method: webflux
      url: .*
      http-content-type: application/json;charset=UTF-8
      filter-order: 1
      rate-limits:
        - bandwidths:
            - capacity: 10000
              time: 1
              unit: seconds
  cache-to-use: caffeine

# --- Actuator Endpoints ---

management:
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# --- Logging ---

logging.level:
  "[io.sapl]": INFO
  "[org.springframework]": INFO
  "[io.micrometer.core.instrument.binder.jvm.JvmGcMetrics]": ERROR
