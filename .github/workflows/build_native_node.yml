name: Build Native SAPL Node

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build the macOS native image.
        type: boolean
        default: false
  workflow_call:
    inputs:
      maven_cache_key:
        required: true
        type: string
      build_macos:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-maven:
    if: inputs.maven_cache_key == ''
    uses: ./.github/workflows/prepare_maven.yml

  build-native:
    needs: [prepare-maven]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: sapl-linux-amd64
            executable: sapl
            profile: native-linux
            upload-path: |
              sapl-node/target/sapl
              sapl-node/target/generated-man/*.1
              sapl-node/target/generated-completion/sapl.bash
              sapl-node/target/classes/META-INF/sbom/application.cdx.json
          - os: ubuntu-24.04-arm
            artifact-name: sapl-linux-arm64
            executable: sapl
            profile: native-linux-arm
            upload-path: |
              sapl-node/target/sapl
              sapl-node/target/classes/META-INF/sbom/application.cdx.json
          - os: windows-latest
            artifact-name: sapl-windows-amd64
            executable: sapl.exe
            profile: native
            upload-path: |
              sapl-node/target/sapl.exe
              sapl-node/target/classes/META-INF/sbom/application.cdx.json
      fail-fast: false

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Native Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-dev musl-tools
          # GraalVM hardcodes x86_64-linux-musl-gcc in HostedMuslLibC regardless of arch
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc
          # Get musl-compiled static zlib from Alpine's package manager
          docker run --rm -v /tmp/alpine-zlib:/out alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b sh -c 'apk add --no-cache zlib-static && cp /usr/lib/libz.a /out/'
          sudo cp /tmp/alpine-zlib/libz.a "/usr/lib/$(uname -m)-linux-musl/"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          version: '25.0.5.0.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Restore Maven dependencies
        uses: ./.github/actions/restore-maven
        with:
          key: ${{ inputs.maven_cache_key || needs.prepare-maven.outputs.cache_key }}

      - name: Build Dependencies
        shell: bash
        run: mvn -o -B install -pl sapl-node -P${{ matrix.profile }} -am -DskipTests

      - name: Package Maven SBOM resources
        shell: bash
        run: bash .github/maven/package-sbom.sh sapl-node -Dmaven.test.skip=true

      - name: Build Native Image
        shell: bash
        run: mvn -o -B package -pl sapl-node -P${{ matrix.profile }} -am -DskipTests

      - name: Upload Native Executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.upload-path }}
          if-no-files-found: error
          retention-days: 7

  build-native-macos:
    name: Build (macos-15-xlarge)
    needs: [prepare-maven]
    if: ${{ !failure() && !cancelled() && inputs.build_macos }}
    runs-on: macos-15-xlarge
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          version: '25.0.5.0.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Restore Maven dependencies
        uses: ./.github/actions/restore-maven
        with:
          key: ${{ inputs.maven_cache_key || needs.prepare-maven.outputs.cache_key }}

      - name: Build Dependencies
        shell: bash
        run: mvn -o -B install -pl sapl-node -am -DskipTests

      - name: Package Maven SBOM resources
        shell: bash
        run: bash .github/maven/package-sbom.sh sapl-node -Dmaven.test.skip=true

      - name: Build Native Image
        shell: bash
        run: mvn -o -B package -pl sapl-node -Pnative -DskipTests

      - name: Upload Native Executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapl-macos-arm64
          path: |
            sapl-node/target/sapl
            sapl-node/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 7
