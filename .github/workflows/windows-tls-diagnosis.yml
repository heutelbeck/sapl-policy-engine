# A temporary, narrow run of the TLS tests of the node on Windows, for fast feedback while the
# expiry check is investigated there. Remove it once the cause is fixed.
name: Windows TLS diagnosis

on:
  workflow_dispatch:
  push:
    branches: ['ci-diagnosis/**']

permissions:
  contents: read

jobs:
  node-tls:
    name: Node tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # All tests of the node: the TLS tests pass on their own and fail only after other test classes.
      - name: Run the tests of the node
        run: mvn -B test -pl sapl-node -am "-Dsurefire.failIfNoSpecifiedTests=false" "-Djacoco.skip=true" "-Dsonar.skip=true"
        env:
          LOGGING_LEVEL_IO_SAPL_NODE_BOOT: DEBUG

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-tls-reports
          path: sapl-node/target/surefire-reports/
