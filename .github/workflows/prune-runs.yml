# Removes old workflow runs together with their logs and artifacts. The newest runs
# are always kept, older runs only up to an age limit. Releases and their assets are
# not affected.
name: Prune workflow runs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prune-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    name: Delete old workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      # The newest runs are kept whatever their age.
      KEEP_NEWEST: 20
      # Older runs are kept up to this age in days.
      MAX_AGE_DAYS: 30
      # The token allows about a thousand requests an hour, so a large backlog is
      # removed over several days.
      MAX_DELETIONS: 500
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Delete runs beyond the newest and older than the age limit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${MAX_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, .created_at, .status] | @tsv' > runs.tsv
          tail -n +"$((KEEP_NEWEST + 1))" runs.tsv | awk -F '\t' -v cutoff="$cutoff" '$2 < cutoff && $3 == "completed" { print $1 }' > candidates.txt
          head -n "$MAX_DELETIONS" candidates.txt > doomed.txt
          echo "Runs listed: $(wc -l < runs.tsv), runs to delete now: $(wc -l < doomed.txt), cutoff: ${cutoff}"
          while read -r run; do
            gh api --method DELETE "repos/${REPOSITORY}/actions/runs/${run}" --silent
          done < doomed.txt
          echo "Deleted $(wc -l < doomed.txt) runs." >> "$GITHUB_STEP_SUMMARY"
