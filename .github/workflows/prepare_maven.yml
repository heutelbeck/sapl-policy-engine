name: Prepare Maven Dependencies

on:
  workflow_call:
    outputs:
      cache_key:
        description: Exact key of the complete shared Maven base.
        value: ${{ jobs.prepare.outputs.cache_key }}
      version:
        description: Maven project version.
        value: ${{ jobs.prepare.outputs.version }}
      is_snapshot:
        description: Whether the project version is a snapshot.
        value: ${{ jobs.prepare.outputs.is_snapshot }}
      is_tag:
        description: Whether the ref is a release tag.
        value: ${{ jobs.prepare.outputs.is_tag }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: maven-preparation-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Maven
        run: bash .github/maven/setup.sh

      - name: Compute Maven cache key
        id: key
        env:
          DEPENDENCY_HASH: ${{ hashFiles('**/pom.xml', '.mvn/**', '.github/maven/*.sh', '.github/actions/restore-maven/**', '.github/workflows/*.yml', '.github/workflows/*.yaml', '.github/scripts/lsp-library-smoke-test.sh', 'sapl-benchmark/scripts/build.sh') }}
        run: echo "key=maven-base-v1-$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Maven base
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/maven/repository
          key: ${{ steps.key.outputs.key }}
          restore-keys: maven-base-
          enableCrossOsArchive: true

      - name: Prepare Maven dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mvn -version
          bash .github/maven/prepare.sh
          echo "$MAVEN_CACHE_KEY" > .github/maven/repository/.complete
        env:
          MAVEN_CACHE_KEY: ${{ steps.key.outputs.key }}

      - name: Publish complete Maven base
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/maven/repository
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Verify published Maven base
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/maven/repository
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
          fail-on-cache-miss: true

      - name: Extract Version
        id: version
        env:
          MAVEN_CACHE_KEY: ${{ steps.key.outputs.key }}
        run: |
          test "$(cat .github/maven/repository/.complete)" = "$MAVEN_CACHE_KEY"
          if ! VERSION=$(mvn -o -B -Dmaven.repo.local="$PWD/.github/maven/repository" help:evaluate -Dexpression=project.version -q -DforceStdout); then
            mvn -o -B -Dmaven.repo.local="$PWD/.github/maven/repository" help:evaluate -Dexpression=project.version
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "Failed to extract the Maven project version." >&2
            exit 1
          fi
          echo "Extracted version: $VERSION."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
