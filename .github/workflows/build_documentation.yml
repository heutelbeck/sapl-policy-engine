name: Push documentation to sapl.io

on:
  workflow_call:
    inputs:
      maven_cache_key:
        required: false
        type: string
        default: ''
    secrets:
      GHUB_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'sapl-documentation/**'

permissions:
  contents: read

jobs:
  prepare-maven:
    if: inputs.maven_cache_key == ''
    uses: ./.github/workflows/prepare_maven.yml

  build:
    needs: [prepare-maven]
    if: ${{ !failure() && !cancelled() }}

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Restore Maven dependencies
        uses: ./.github/actions/restore-maven
        with:
          key: ${{ inputs.maven_cache_key || needs.prepare-maven.outputs.cache_key }}

      - name: Get version
        id: get-version
        run: |
          # Quiet on success, so the output is the version alone. On failure Maven runs once
          # more with its output, which shows why.
          if ! VERSION=$( mvn -o -B help:evaluate -Dexpression=project.version -q -DforceStdout ); then
            mvn -o -B help:evaluate -Dexpression=project.version
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Required Modules Only
        run: mvn -o -B clean install -pl sapl-documentation-generator,sapl-node,sapl-bom -am -DskipTests -T 1C

      - name: Package Maven SBOM resources
        run: bash .github/maven/package-sbom.sh sapl-node

      - name: Run Documentation Generator
        run: |
          pushd sapl-documentation-generator
          mvn spring-boot:run -o
          popd

      - name: Combine Documentation Directories
        run: |
          mkdir -p combined-documentation
          cp -r sapl-documentation/* combined-documentation/
          cp -r sapl-documentation-generator/target/doc/* combined-documentation/
          cp sapl-node/target/generated-docs/7_9_CommandLine.md combined-documentation/

      - name: Push Documentation to Website
        # Snapshot versions publish on every run. Release versions publish only
        # from a release tag, never from an untagged push of a release version.
        # Manual dispatch always publishes. ref_type is used instead of
        # event_name because a reusable workflow_call reports the caller's event.
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || endsWith(steps.get-version.outputs.version, '-SNAPSHOT')
        uses: hpcodecraft/action-deploy-workspace-to-repo@1aa539ca78d3063db25aeb60124c034f6ba9a611 # v2.2
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GHUB_ACCESS_TOKEN }}
          SRC_FOLDER: combined-documentation
          DEST_OWNER: heutelbeck
          DEST_REPO: sapl-pages
          DEST_BRANCH: master
          DEST_FOLDER: documentation-md/${{ steps.get-version.outputs.version }}
          DEST_PREDEPLOY_CLEANUP: "rm -rf documentation-md/${{ steps.get-version.outputs.version }}/*"
