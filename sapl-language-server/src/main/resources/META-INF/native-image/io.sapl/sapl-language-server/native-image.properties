# GraalVM Native Image configuration for SAPL Language Server
Args = --no-fallback \
       --initialize-at-build-time=org.slf4j \
       --initialize-at-build-time=ch.qos.logback \
       --initialize-at-build-time=io.github.classgraph.vfs.VfsFileSystemProvider \
       -H:+ReportExceptionStackTraces \
       --enable-url-protocols=http,https
